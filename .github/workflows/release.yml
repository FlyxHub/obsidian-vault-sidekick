# Builds the plugin and publishes a GitHub release when a version tag is pushed.
# The tag must equal the version in manifest.json, with no "v" prefix (Obsidian requires this).
name: Release

on:
  push:
    tags: ['*']

permissions:
  contents: write
  id-token: write # signs the build provenance attestation
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Check the tag matches manifest.json
        run: test "$GITHUB_REF_NAME" = "$(node -p "require('./manifest.json').version")"

      - run: npm ci
      - run: npm test
      - run: npm run build

      # Lets anyone verify the release files were built here: gh attestation verify main.js -R <repo>
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            main.js
            styles.css

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes main.js manifest.json styles.css
