# Runs on every pull request: the tests, the build, and the lint rules Obsidian's community directory
# reviews releases with (eslint-plugin-obsidianmd). Warnings don't fail it; the directory doesn't block on them either.
name: Check

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            lint/package-lock.json

      - run: npm ci
      - run: npm ci --prefix lint
      - run: npm test
      - run: npm run build
      - run: npm run lint
