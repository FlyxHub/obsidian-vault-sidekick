# Runs on every pull request: the tests, the build, and the lint rules Obsidian's community directory
# reviews releases with (eslint-plugin-obsidianmd). Warnings don't fail it; the directory doesn't block on them either.
name: Check

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            lint/package-lock.json

      - run: npm ci
      - run: npm ci --prefix lint
      - run: npm test
      - run: npm run build
      - run: npm run lint
